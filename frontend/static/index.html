<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stargazer - Cosmic Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --bg-dark: #090714;
    --border-glow: rgba(139, 92, 246, 0.25);
    --accent-gradient: linear-gradient(135deg, #8b5cf6, #6366f1);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --user-bubble: linear-gradient(135deg, #7c3aed, #4f46e5);
    --agent-bubble: rgba(24, 20, 48, 0.85);
    --border-light: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.12) 0%, transparent 40%);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    background: rgba(15, 12, 33, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-light);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand-icon {
    font-size: 1.5rem;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.6));
  }
  .brand-info { display: flex; flex-direction: column; }
  .brand-title {
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #ffffff, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-subtitle { font-size: 0.75rem; color: var(--text-muted); }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #4ade80;
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ade80;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Dialogue Row Layout */
  .msg {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .msg.agent .avatar {
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid var(--border-glow);
    box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
  }
  .msg.user .avatar {
    background: rgba(99, 102, 241, 0.2);
    border: 1px solid rgba(99, 102, 241, 0.4);
  }

  .msg-content {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }
  .msg.user .msg-content { align-items: flex-end; }

  .sender-name {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
    padding: 0 0.25rem;
    font-weight: 500;
  }

  .bubble {
    padding: 0.8rem 1.1rem;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.agent .bubble {
    background: var(--agent-bubble);
    border: 1px solid var(--border-glow);
    backdrop-filter: blur(10px);
    color: #f1f5f9;
    border-top-left-radius: 4px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
  }

  /* When the reply is an A2UI card, drop the bubble chrome */
  .bubble.rich { background: transparent; border: none; padding: 0; max-width: 100%; white-space: normal; box-shadow: none; }

  /* Footer Controls & Input */
  .footer-container {
    background: rgba(15, 12, 33, 0.9);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border-light);
    padding: 0.75rem 1rem 1rem 1rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }

  .prompts-container {
    display: flex;
    gap: 0.6rem;
    padding-bottom: 0.75rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .prompts-container::-webkit-scrollbar { display: none; }

  .prompt-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.825rem;
    color: #d8b4fe;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .prompt-btn:hover {
    background: rgba(139, 92, 246, 0.2);
    border-color: #a855f7;
    color: #ffffff;
    transform: translateY(-1px);
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
  }

  form { display: flex; gap: 0.6rem; }
  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    background: rgba(23, 19, 46, 0.8);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    color: #ffffff;
    outline: none;
    transition: all 0.2s ease;
  }
  input::placeholder { color: #64748b; }
  input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.25);
    background: rgba(29, 24, 58, 0.9);
  }

  button {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
    filter: brightness(1.1);
  }

  /* A2UI Component Styles */
  .a2card {
    border: 1px solid rgba(139, 92, 246, 0.25);
    border-radius: 14px;
    padding: 1.1rem;
    background: rgba(22, 18, 43, 0.9);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.4; color: #f1f5f9; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #c084fc; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #e9d5ff; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #f3e8ff; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.825rem; color: #94a3b8; }
  .a2divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; border: 1px solid rgba(255, 255, 255, 0.1); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: #c084fc; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-icon">✨</span>
    <div class="brand-info">
      <span class="brand-title">Stargazer Guide</span>
      <span class="brand-subtitle">AI Astronomy & Observation Companion</span>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    <span>Connected</span>
  </div>
</header>

<div id="log"></div>

<div class="footer-container">
  <div class="prompts-container">
    <button class="prompt-btn" type="button" data-prompt="Show tonight's top celestial targets">🌌 Top celestial targets</button>
    <button class="prompt-btn" type="button" data-prompt="Simulate telescopic view of Orion Nebula">🔭 Simulate Orion Nebula view</button>
    <button class="prompt-btn" type="button" data-prompt="Calculate magnification for 200mm aperture with 10mm eyepiece">⚙️ Calculate telescope optics</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask Stargazer something…" autocomplete="off" autofocus>
    <button>
      <span>Send</span>
      <span style="font-size:0.9rem;">✦</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "✨");
  const content = el("div", "msg-content");
  const sender = el("div", "sender-name", who === "user" ? "You" : "Stargazer Guide");
  const b = el("div", "bubble");
  
  content.appendChild(sender);
  content.appendChild(b);
  m.appendChild(avatar);
  m.appendChild(content);
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

document.querySelectorAll(".prompt-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.dataset.prompt;
    form.requestSubmit();
  });
});
</script>
</body>
</html>
